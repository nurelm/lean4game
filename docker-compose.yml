# lean4game in Docker. Used via scripts/run_local.sh / scripts/run_tests.sh
# (which pin the project name and file), or directly:
#   docker compose build && docker compose up
#
# Host-side overrides via .env in this directory:
#   LEAN4GAME_PORT=3000          host port published for the app
#   LEAN4GAME_NODE_ENV=development  relay mode (development enables local games)
name: lean4game

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: lean4game-local
    init: true
    ports:
      - "${LEAN4GAME_PORT:-3000}:3000"
    environment:
      # development mode: local games (`/#/g/local/<name>` under /srv) are
      # served and listed on the landing page; production disables them.
      NODE_ENV: ${LEAN4GAME_NODE_ENV:-development}
      PORT: 3000
      API_PORT: 8010
      # game sessions are spawned without bubblewrap; isolation is provided
      # by the container itself. Do not expose this deployment to untrusted users.
      NO_BWRAP: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/games').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  test:
    image: lean4game-local
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["test"]
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PORT: 8010
      NO_BWRAP: "true"
    command: ["bash", "docker/run-tests.sh"]